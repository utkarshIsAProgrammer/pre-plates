# ==============================================================
# PrePlates — Render Blueprint (Unified Single Service)
# Same architecture as Knots:
# • 1 single Web Service serves both Frontend (Vite SPA) and Backend (Express API)
# • Uses only 1 free tier instance (750 hours/month — never runs out)
# • Zero CORS latency & eliminates cross-origin preflight requests
# ==============================================================

services:
  - type: web
    name: preplates
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Web Push — generate once:
      #   node -e "console.log(JSON.stringify(require('web-push').generateVAPIDKeys()))"
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: https://preplates.app
      # Optional: Upstash Redis (REST, not TCP) for shared rate limits + caching
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
